aid: 10x-genomics
name: 10x Genomics
description: '10x Genomics is a life sciences technology company building instruments, reagents, and
  software that resolve biology at single-cell and spatial resolution. Its Chromium platform delivers
  single-cell gene expression, immune profiling, and multiomic analysis; its Visium and Xenium platforms
  deliver spatial transcriptomics and in situ single-cell spatial biology. The company supports researchers
  with analysis software (Cell Ranger, Space Ranger, Xenium Onboard Analysis, Loupe Browser), a cloud
  analysis platform, and open datasets. 10x Genomics does not publish a general-purpose public REST
  developer API; its developer surface is command-line analysis pipelines, file-format tooling, and
  open-source repositories on GitHub.'
